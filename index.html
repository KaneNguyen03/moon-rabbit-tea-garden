<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16120e">
    <title>Moon Rabbit Tea Garden</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-title">Moon Rabbit Tea Garden</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
        <div id="loading-error"></div>
      </div>
    </div>
    <div id="renderer"></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var error = document.querySelector("#loading-error");
      var renderer = document.querySelector("#renderer");

      function rendererName() {
        if (canvas.getContext("webgpu")) return "WebGPU";
        if (canvas.getContext("webgl2")) return navigator.gpu ? "WebGL 2 (fallback)" : "WebGL 2 (fallback: no WebGPU in this browser)";
        return "unknown";
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) document.body.className = "phone";

      var config = {
        arguments: [],
        dataUrl: "Build/WebGL.data.unityweb",
        frameworkUrl: "Build/WebGL.framework.js.unityweb",
        codeUrl: "Build/WebGL.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "VuonTraTho",
        productName: "Moon Rabbit Tea Garden",
        productVersion: "0.1.0",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        autoSyncPersistentDataPath: true,
        showBanner: function (message, type) {
          if (type === "error") error.textContent = message;
          console[type === "error" ? "error" : "warn"](message);
        }
      };

      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
        var line = "Renderer: " + rendererName();
        console.info(line);
        if (new URLSearchParams(location.search).has("debug")) renderer.textContent = line;
      }).catch(function (message) {
        error.textContent = message;
      });
    </script>
  </body>
</html>
