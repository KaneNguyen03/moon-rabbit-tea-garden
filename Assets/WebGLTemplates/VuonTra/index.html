<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#16120e">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="frame">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div id="loading-title">{{{ PRODUCT_NAME }}}</div>
        <div id="loading-track"><div id="loading-fill"></div></div>
        <div id="loading-error"></div>
      </div>
    </div>
    <div id="renderer"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#loading");
      var fill = document.querySelector("#loading-fill");
      var error = document.querySelector("#loading-error");
      var renderer = document.querySelector("#renderer");

      function rendererName() {
        if (canvas.getContext("webgpu")) return "WebGPU";
        if (canvas.getContext("webgl2")) return navigator.gpu ? "WebGL 2 (fallback)" : "WebGL 2 (fallback: no WebGPU in this browser)";
        return "unknown";
      }

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) document.body.className = "phone";

      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        autoSyncPersistentDataPath: true,
        showBanner: function (message, type) {
          if (type === "error") error.textContent = message;
          console[type === "error" ? "error" : "warn"](message);
        }
      };

      createUnityInstance(canvas, config, function (progress) {
        fill.style.width = Math.round(progress * 100) + "%";
      }).then(function () {
        loading.remove();
        renderer.textContent = "Renderer: " + rendererName();
      }).catch(function (message) {
        error.textContent = message;
      });
    </script>
  </body>
</html>
