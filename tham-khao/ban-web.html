<title>Vườn Trà Nấm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen game. Moonlit forest scene (canvas) on top, a drawer of stations and charms below;
   scene and drawer sit side by side on wide screens. Single dark look by choice: the game happens at night. */
:root{
  color-scheme:dark;
  --night:#161a3a;
  --dusk:#2a2f63;
  --panel:#20254f;
  --panel-2:#2b3166;
  --line:#3d4480;
  --moss:#3f8a6c;
  --lantern:#ffc866;
  --coral:#f27d6b;
  --cream:#fff1d2;
  --muted:#aab0da;
  --ink:#2a2140;
  --font-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--font-body);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

.app{height:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-rows:auto minmax(210px,42%) minmax(0,1fr)}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1;letter-spacing:.2px}
.purse{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 8px}
.dew{width:20px;height:20px;border-radius:60% 60% 60% 60%/75% 75% 50% 50%;background:radial-gradient(circle at 35% 35%,#fff,#bfe9ff 45%,#6fb4f0);box-shadow:0 0 10px #8fd0ff88;flex:none}
#coins{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1;font-variant-numeric:tabular-nums}
#ips{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}

.scene{position:relative;overflow:hidden;min-height:0;background:var(--dusk)}
.scene canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation;cursor:pointer}
.hint,.toast{position:absolute;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);text-align:center;border-radius:999px;padding:6px 14px;font-size:13px;pointer-events:none}
.hint{top:10px;background:#161a3acc;color:var(--cream);border:1px solid var(--line)}
.toast{bottom:10px;background:var(--lantern);color:var(--ink);font-weight:600}

.panel{min-height:0;display:flex;flex-direction:column;background:var(--panel);border-top:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:10px}
.tabs,.modes{display:flex;gap:4px;background:var(--night);border-radius:999px;padding:3px}
.tabs button,.modes button{border-radius:999px;padding:6px 14px;color:var(--muted);font-weight:600;font-size:13px}
.modes button{padding:6px 10px;font-variant-numeric:tabular-nums}
.tabs button[aria-selected="true"],.modes button[aria-pressed="true"]{background:var(--panel-2);color:var(--cream)}
.list{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:16px}

.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;background:var(--panel-2);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.row.locked{opacity:.72}
.ico{width:48px;height:48px;border-radius:12px;background:var(--night)}
.info{min-width:0;display:flex;flex-direction:column;gap:3px}
.nm{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.15;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lv{font-family:var(--font-body);font-weight:600;font-size:11px;color:var(--lantern);letter-spacing:.3px}
.sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ms{height:4px;border-radius:2px;background:var(--night);overflow:hidden}
.ms i{display:block;height:100%;width:0;background:var(--moss);border-radius:2px}
.buy{min-width:98px;display:flex;flex-direction:column;align-items:center;gap:1px;background:var(--lantern);color:var(--ink);border-radius:12px;padding:7px 10px;transition:transform .08s}
.buy:active:not(:disabled){transform:scale(.95)}
.buy:disabled{background:var(--line);color:var(--muted);cursor:default}
.buy .b1{font-size:11px;font-weight:600}
.buy .b2{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.reset{align-self:center;margin-top:6px;color:var(--muted);font-size:12px;text-decoration:underline;padding:8px}

.modal{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d22cc;z-index:20;padding:16px}
.card{background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:22px 22px 18px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:22px;text-wrap:balance}
.card p{margin:0;color:var(--muted);line-height:1.5}
.card strong{display:block;font-family:var(--font-display);font-size:30px;color:var(--lantern);font-variant-numeric:tabular-nums}
.card button{background:var(--lantern);color:var(--ink);border-radius:12px;padding:10px;font-weight:600;margin-top:4px}

@media (min-width:900px){
  .app{grid-template-rows:auto minmax(0,1fr);grid-template-columns:1.25fr 1fr}
  .hud{grid-column:1/-1}
  .panel{border-top:0;border-left:1px solid var(--line)}
  .scene{border-radius:0 0 0 18px}
}
@media (prefers-reduced-motion:reduce){.buy{transition:none}}
</style>

<div class="app">
  <header class="hud gutter">
    <div class="brand">Vườn Trà Nấm</div>
    <div class="purse" title="Sương trăng">
      <span class="dew" aria-hidden="true"></span>
      <span id="coins">0</span>
      <span id="ips">+0/giây</span>
    </div>
  </header>

  <section class="scene" id="scene">
    <canvas id="cv" aria-label="Khu vườn: chạm vào bé nấm để làm trà nhanh hơn"></canvas>
    <div class="hint" id="hint">Chạm vào bé nấm để làm nhanh hơn</div>
    <div class="toast" id="toast" hidden></div>
  </section>

  <section class="panel">
    <div class="bar gutter">
      <div class="tabs" role="tablist">
        <button id="tab-st" role="tab" aria-selected="true">Trạm trà</button>
        <button id="tab-ch" role="tab" aria-selected="false">Bùa phép</button>
      </div>
      <div class="modes" id="modes" aria-label="Số cấp mỗi lần nâng">
        <button data-m="1" aria-pressed="true">×1</button>
        <button data-m="10" aria-pressed="false">×10</button>
        <button data-m="0" aria-pressed="false">Tối đa</button>
      </div>
    </div>
    <div class="list gutter" id="list-st"></div>
    <div class="list gutter" id="list-ch" hidden></div>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="card">
    <h2>Mừng bạn quay lại</h2>
    <p>Lúc bạn đi vắng, các bé nấm vẫn chăm chỉ pha trà và gom được</p>
    <strong id="away-amt">0</strong>
    <p id="away-time"></p>
    <button id="away-ok">Nhận sương</button>
  </div>
</div>

<script>
(function(){
'use strict';
var SAVE_KEY='vuon-tra-nam-v1';
var MILES=[10,25,50,100,150,200,300,400,500];
var ST=[
  {name:'Giỏ lá trà',      cost:10,     inc:1,      time:1.5, g:1.09, cap:'#f27d6b'},
  {name:'Ấm trà sương',    cost:120,    inc:9,      time:3,   g:1.11, cap:'#6fb7b0'},
  {name:'Cối giã hoa',     cost:1400,   inc:80,     time:5,   g:1.12, cap:'#c58be0'},
  {name:'Hũ mật ong',      cost:16000,  inc:700,    time:8,   g:1.13, cap:'#f0a93a'},
  {name:'Lò bánh hạt dẻ',  cost:190000, inc:6500,   time:12,  g:1.13, cap:'#b98a5e'},
  {name:'Nồi mứt dâu',     cost:2.4e6,  inc:62000,  time:17,  g:1.14, cap:'#e0577a'},
  {name:'Quầy trà sữa trăng',cost:3.2e7,inc:600000, time:24,  g:1.14, cap:'#8fb4ff'},
  {name:'Bình ủ sao',      cost:4.5e8,  inc:6e6,    time:32,  g:1.15, cap:'#ffd98a'}
];
var CH=[
  {id:'hand', name:'Bàn tay ấm',   desc:'Mỗi lần chạm làm nhanh thêm 0,2 giây', cost:80,   g:3,  max:10},
  {id:'wind', name:'Gió đêm',      desc:'Mọi trạm làm nhanh hơn 10%',            cost:600,  g:5,  max:10},
  {id:'moon', name:'Ánh trăng rằm',desc:'Mọi trạm thu gấp đôi sương',            cost:3000, g:15, max:10},
  {id:'sleep',name:'Giấc ngủ dài', desc:'Vắng mặt vẫn thu thêm 2 giờ',           cost:5000, g:10, max:5}
];

function fresh(){return {coins:0,lv:[1,0,0,0,0,0,0,0],prog:[0,0,0,0,0,0,0,0],ch:{hand:0,wind:0,moon:0,sleep:0},last:Date.now(),mode:1,hinted:false};}
var S=fresh();

/* ---------- numbers ---------- */
var UNITS=['','K','M','B','T','aa','ab','ac','ad','ae','af','ag'];
function fmt(n){
  if(!isFinite(n)) return '∞';
  if(n<1000) return String(Math.floor(n));
  var e=Math.min(UNITS.length-1,Math.floor(Math.log10(n)/3));
  var v=n/Math.pow(1000,e);
  var s=v>=100?v.toFixed(0):v>=10?v.toFixed(1):v.toFixed(2);
  return s.replace('.',',')+UNITS[e];
}
function fmt1(n){return n<10?n.toFixed(1).replace('.',','):fmt(n);}

/* ---------- economy ---------- */
function mileMult(lv){var m=1;for(var k=0;k<MILES.length;k++){if(lv>=MILES[k])m*=2;}return m;}
function income(i){return ST[i].inc*S.lv[i]*mileMult(S.lv[i])*Math.pow(2,S.ch.moon);}
function speed(){return 1+0.1*S.ch.wind;}
function cycle(i){return ST[i].time/speed();}
function ips(){var t=0;for(var i=0;i<ST.length;i++){if(S.lv[i]>0)t+=income(i)/cycle(i);}return t;}
function costN(i,n){var s=ST[i];return s.cost*Math.pow(s.g,S.lv[i])*(Math.pow(s.g,n)-1)/(s.g-1);}
function maxN(i){var s=ST[i],c0=s.cost*Math.pow(s.g,S.lv[i]);return Math.max(0,Math.floor(Math.log(S.coins*(s.g-1)/c0+1)/Math.log(s.g)));}
function buyCount(i){
  if(S.lv[i]===0) return 1;
  if(S.mode===0) return Math.max(1,maxN(i));
  return S.mode;
}
function chCost(c){return c.cost*Math.pow(c.g,S.ch[c.id]);}
function tapSec(){return 0.4+0.2*S.ch.hand;}
function awayCap(){return (2+2*S.ch.sleep)*3600;}

/* ---------- save ---------- */
function save(){S.last=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function adopt(d){
  if(!d||!Array.isArray(d.lv)) return false;
  var f=fresh();
  f.coins=+d.coins||0;
  for(var i=0;i<ST.length;i++){f.lv[i]=Math.max(0,Math.floor(+d.lv[i]||0));f.prog[i]=(d.prog&&+d.prog[i])||0;}
  if(f.lv[0]<1) f.lv[0]=1;
  for(var k in f.ch){f.ch[k]=Math.max(0,Math.floor((d.ch&&+d.ch[k])||0));}
  f.last=+d.last||Date.now();
  f.mode=(d.mode===10||d.mode===0)?d.mode:1;
  f.hinted=!!d.hinted;
  S=f;return true;
}
function load(){try{var raw=localStorage.getItem(SAVE_KEY);if(raw)return adopt(JSON.parse(raw));}catch(e){}return false;}

/* ---------- DOM ---------- */
function $(id){return document.getElementById(id);}
var elCoins=$('coins'),elIps=$('ips'),elHint=$('hint'),elToast=$('toast');
var listSt=$('list-st'),listCh=$('list-ch');
var rows=[],chRows=[];
var toastTimer=0;
function toast(msg){elToast.textContent=msg;elToast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){elToast.hidden=true;},2600);}

function buildRows(){
  listSt.textContent='';rows=[];
  ST.forEach(function(s,i){
    var row=document.createElement('div');row.className='row';
    var ico=document.createElement('canvas');ico.className='ico';ico.width=96;ico.height=96;
    var x=ico.getContext('2d');x.translate(48,74);x.scale(2.3,2.3);drawProp(x,i,0,0.8);
    var info=document.createElement('div');info.className='info';
    var nm=document.createElement('div');nm.className='nm';
    var nmT=document.createElement('span');nmT.textContent=s.name;
    var lv=document.createElement('span');lv.className='lv';
    nm.appendChild(nmT);nm.appendChild(lv);
    var sub=document.createElement('div');sub.className='sub';
    var ms=document.createElement('div');ms.className='ms';var bar=document.createElement('i');ms.appendChild(bar);
    info.appendChild(nm);info.appendChild(sub);info.appendChild(ms);
    var btn=document.createElement('button');btn.className='buy';btn.id='buy-'+i;
    var b1=document.createElement('span');b1.className='b1';var b2=document.createElement('span');b2.className='b2';
    btn.appendChild(b1);btn.appendChild(b2);
    btn.addEventListener('click',function(){buyStation(i);});
    row.appendChild(ico);row.appendChild(info);row.appendChild(btn);
    listSt.appendChild(row);
    rows.push({row:row,lv:lv,sub:sub,bar:bar,btn:btn,b1:b1,b2:b2});
  });
  listCh.textContent='';chRows=[];
  CH.forEach(function(c,k){
    var row=document.createElement('div');row.className='row';
    var ico=document.createElement('canvas');ico.className='ico';ico.width=96;ico.height=96;
    drawCharmIcon(ico.getContext('2d'),k);
    var info=document.createElement('div');info.className='info';
    var nm=document.createElement('div');nm.className='nm';
    var nmT=document.createElement('span');nmT.textContent=c.name;
    var lv=document.createElement('span');lv.className='lv';
    nm.appendChild(nmT);nm.appendChild(lv);
    var sub=document.createElement('div');sub.className='sub';sub.textContent=c.desc;
    info.appendChild(nm);info.appendChild(sub);
    var btn=document.createElement('button');btn.className='buy';btn.id='charm-'+c.id;
    var b1=document.createElement('span');b1.className='b1';var b2=document.createElement('span');b2.className='b2';
    btn.appendChild(b1);btn.appendChild(b2);
    btn.addEventListener('click',function(){buyCharm(c);});
    row.appendChild(ico);row.appendChild(info);row.appendChild(btn);
    listCh.appendChild(row);
    chRows.push({lv:lv,btn:btn,b1:b1,b2:b2});
  });
  var reset=document.createElement('button');reset.className='reset';reset.id='reset';reset.textContent='Làm lại từ đầu';
  var armed=0;
  reset.addEventListener('click',function(){
    if(Date.now()-armed<3000){S=fresh();save();fx=[];refresh();reset.textContent='Làm lại từ đầu';toast('Khu vườn đã trở về đêm đầu tiên');armed=0;}
    else{armed=Date.now();reset.textContent='Chạm lần nữa để xóa toàn bộ tiến trình';setTimeout(function(){if(armed){reset.textContent='Làm lại từ đầu';armed=0;}},3000);}
  });
  listCh.appendChild(reset);
}

function refresh(){
  elCoins.textContent=fmt(S.coins);
  elIps.textContent='+'+fmt1(ips())+'/giây';
  for(var i=0;i<ST.length;i++){
    var r=rows[i],lv=S.lv[i],locked=lv===0;
    r.row.classList.toggle('locked',locked);
    if(locked){
      var prevOk=i===0||S.lv[i-1]>0;
      r.lv.textContent='Chưa mở';
      r.sub.textContent=prevOk?('Thu '+fmt(ST[i].inc*Math.pow(2,S.ch.moon))+' sương / '+fmt1(cycle(i))+' giây'):'Mở trạm phía trên trước';
      r.bar.style.width='0%';
      r.b1.textContent='Mở trạm';r.b2.textContent=fmt(ST[i].cost);
      r.btn.disabled=!prevOk||S.coins<ST[i].cost;
    }else{
      var n=buyCount(i),c=costN(i,n);
      var prev=0,next=0;
      for(var k=0;k<MILES.length;k++){if(lv>=MILES[k])prev=MILES[k];else{next=MILES[k];break;}}
      r.lv.textContent='Cấp '+lv;
      r.sub.textContent=fmt(income(i))+' sương / '+fmt1(cycle(i))+' giây'+(next?' · ×2 ở cấp '+next:'');
      r.bar.style.width=(next?Math.round((lv-prev)/(next-prev)*100):100)+'%';
      r.b1.textContent='Nâng +'+n;r.b2.textContent=fmt(c);
      r.btn.disabled=S.coins<c;
    }
  }
  for(var j=0;j<CH.length;j++){
    var cc=CH[j],cr=chRows[j],l=S.ch[cc.id],full=l>=cc.max;
    cr.lv.textContent='Cấp '+l+'/'+cc.max;
    cr.b1.textContent=full?'Đã đầy':'Học bùa';
    cr.b2.textContent=full?'—':fmt(chCost(cc));
    cr.btn.disabled=full||S.coins<chCost(cc);
  }
}

function buyStation(i){
  var lv=S.lv[i];
  if(lv===0){
    if((i>0&&S.lv[i-1]===0)||S.coins<ST[i].cost) return;
    S.coins-=ST[i].cost;S.lv[i]=1;S.prog[i]=0;anim[i].jump=1;
    toast('Một bé nấm mới thức dậy ở '+ST[i].name);
  }else{
    var n=buyCount(i),c=costN(i,n);
    if(S.coins<c) return;
    var before=mileMult(lv);
    S.coins-=c;S.lv[i]=lv+n;anim[i].jump=1;
    if(mileMult(S.lv[i])>before) toast(ST[i].name+' đạt cấp '+S.lv[i]+': thu gấp đôi');
  }
  refresh();save();
}
function buyCharm(c){
  if(S.ch[c.id]>=c.max) return;
  var cost=chCost(c);if(S.coins<cost) return;
  S.coins-=cost;S.ch[c.id]++;
  toast('Đã học '+c.name+' cấp '+S.ch[c.id]);
  refresh();save();
}

$('tab-st').addEventListener('click',function(){setTab(true);});
$('tab-ch').addEventListener('click',function(){setTab(false);});
function setTab(st){
  $('tab-st').setAttribute('aria-selected',st);$('tab-ch').setAttribute('aria-selected',!st);
  listSt.hidden=!st;listCh.hidden=st;$('modes').style.visibility=st?'visible':'hidden';
}
$('modes').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b) return;
  S.mode=+b.dataset.m;syncModes();refresh();
});
function syncModes(){
  Array.prototype.forEach.call($('modes').children,function(b){b.setAttribute('aria-pressed',(+b.dataset.m)===S.mode);});
}
$('away-ok').addEventListener('click',function(){$('modal').hidden=true;});

/* ---------- canvas ---------- */
var cv=$('cv'),ctx=cv.getContext('2d'),W=300,H=200,dpr=1;
var anim=ST.map(function(){return {jump:0,squish:0,floatAcc:0,floatT:0};});
var fx=[];            /* floating "+N" texts */
var gold=null,nextGold=20;  /* bonus firefly */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function resize(){
  var r=$('scene').getBoundingClientRect();
  W=Math.max(120,r.width);H=Math.max(120,r.height);
  dpr=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
}
if(window.ResizeObserver){new ResizeObserver(resize).observe($('scene'));}
window.addEventListener('resize',resize);

function unit(){return Math.max(0.62,Math.min(1.7,Math.min(W/4/100,H/250)));}
function pos(i){
  var c=i%4,r=Math.floor(i/4);
  return {x:(c+0.5)/4*W+(r?W*0.02:-W*0.02),y:H*(r?0.92:0.63)};
}
function rnd(k){var v=Math.sin(k*12.9898)*43758.5453;return v-Math.floor(v);}
function rr(x,a,b,w,h,r){x.beginPath();if(x.roundRect){x.roundRect(a,b,w,h,r);}else{x.rect(a,b,w,h);}x.fill();}
function circ(x,a,b,r){x.beginPath();x.arc(a,b,r,0,6.2832);x.fill();}

function drawProp(x,k,t,p){
  switch(k){
    case 0: /* leaf basket */
      x.fillStyle='#a8703f';x.beginPath();x.moveTo(-12,-12);x.lineTo(12,-12);x.lineTo(9,0);x.lineTo(-9,0);x.closePath();x.fill();
      x.fillStyle='#d19a62';rr(x,-13,-15,26,4,2);
      x.fillStyle='#6fcf8a';
      var n=1+Math.floor(p*4.99);
      for(var a=0;a<n;a++){x.save();x.translate(-8+a*4,-17-(a%2)*3);x.rotate(-0.6+a*0.3);x.beginPath();x.ellipse(0,0,4.5,2.2,0,0,6.2832);x.fill();x.restore();}
      break;
    case 1: /* dew kettle */
      x.fillStyle='#ff9b4a';x.beginPath();x.ellipse(0,-2,5+Math.sin(t*9)*1,4,0,0,6.2832);x.fill();
      x.fillStyle='#ffd98a';circ(x,0,-2,2);
      x.fillStyle='#6fb7b0';x.beginPath();x.ellipse(0,-14,12,9,0,0,6.2832);x.fill();
      x.beginPath();x.moveTo(10,-14);x.quadraticCurveTo(17,-15,17,-22);x.lineTo(14,-22);x.quadraticCurveTo(14,-18,9,-18);x.closePath();x.fill();
      x.fillStyle='#4f9790';rr(x,-7,-24,14,3,1.5);circ(x,0,-25.5,2);
      x.fillStyle='#ffffff';
      for(var s=0;s<3;s++){var ph=(t*0.6+s/3)%1;x.globalAlpha=(1-ph)*0.5*p;circ(x,16+Math.sin(ph*6+s)*2,-24-ph*14,2+ph*2);}
      x.globalAlpha=1;
      break;
    case 2: /* flower mortar */
      x.fillStyle='#8088b8';rr(x,-6,-3,12,3,1.5);
      x.fillStyle='#9aa2cf';x.beginPath();x.ellipse(0,-13,12,11,0,0,3.1416);x.closePath();x.fill();
      x.fillStyle='#f3a6d6';circ(x,-5,-13,2);circ(x,1,-14,2.2);circ(x,6,-13,1.8);
      x.save();x.translate(0,-13);x.rotate(0.5+Math.sin(t*8)*0.25*(p>0?1:0));x.fillStyle='#e8d9b0';rr(x,-2,-17,4,17,2);x.restore();
      break;
    case 3: /* honey jar */
      x.fillStyle='#ffffff33';rr(x,-9,-20,18,20,5);
      x.fillStyle='#f0a93a';var h=3+15*p;rr(x,-8,-1-h,16,h,4);
      x.fillStyle='#ffe2a3';rr(x,-6,-17,2.5,9,1.2);
      x.fillStyle='#b9743a';rr(x,-10,-24,20,5,2);
      break;
    case 4: /* chestnut oven */
      x.fillStyle='#7d7399';rr(x,5,-28,5,10,1.5);
      x.fillStyle='#93899f';x.beginPath();x.ellipse(0,0,15,22,0,3.1416,6.2832);x.closePath();x.fill();
      x.fillStyle='#2a2140';x.beginPath();x.ellipse(0,0,8,11,0,3.1416,6.2832);x.closePath();x.fill();
      x.globalAlpha=0.35+0.55*p;x.fillStyle='#ff9b4a';x.beginPath();x.ellipse(0,0,6,7+Math.sin(t*7)*1,0,3.1416,6.2832);x.closePath();x.fill();x.globalAlpha=1;
      break;
    case 5: /* berry jam pot */
      x.fillStyle='#b23a58';rr(x,-15,-11,4,3,1.5);rr(x,11,-11,4,3,1.5);
      x.fillStyle='#e0577a';rr(x,-12,-14,24,14,5);
      x.fillStyle='#f6a3b8';rr(x,-13,-16,26,4,2);
      x.fillStyle='#ffc2d1';
      for(var b=0;b<3;b++){var bp=(t*0.9+b*0.37)%1;x.globalAlpha=(1-bp)*p;circ(x,-6+b*6,-18-bp*7,1.5+bp*1.5);}
      x.globalAlpha=1;
      break;
    case 6: /* moon milk tea */
      x.strokeStyle='#f27d6b';x.lineWidth=2;x.beginPath();x.moveTo(3,-8);x.lineTo(8,-30);x.stroke();
      x.fillStyle='#ffffff40';x.beginPath();x.moveTo(-10,-24);x.lineTo(10,-24);x.lineTo(7,0);x.lineTo(-7,0);x.closePath();x.fill();
      var th=4+17*p;x.fillStyle='#d9b08c';x.beginPath();x.moveTo(-7-th*0.125,-th);x.lineTo(7+th*0.125,-th);x.lineTo(7,0);x.lineTo(-7,0);x.closePath();x.fill();
      x.fillStyle='#2a2140';circ(x,-4,-2.5,1.6);circ(x,0,-2.2,1.6);circ(x,4,-2.5,1.6);circ(x,-2,-5.5,1.6);circ(x,2.5,-5.5,1.6);
      x.fillStyle='#8fb4ff';rr(x,-11,-26,22,3,1.5);
      break;
    default: /* star still */
      x.fillStyle='#6a5a8c';rr(x,-8,-4,16,4,2);rr(x,-2,-8,4,5,1);
      x.globalAlpha=0.25+0.35*p;x.fillStyle='#ffd98a';circ(x,0,-19,15);x.globalAlpha=1;
      x.fillStyle='#ffffff2e';circ(x,0,-19,12);
      x.strokeStyle='#ffffff88';x.lineWidth=1.2;x.beginPath();x.arc(0,-19,12,0,6.2832);x.stroke();
      x.save();x.translate(0,-19);x.rotate(t*0.8);x.fillStyle='#ffe9a8';x.beginPath();
      for(var q=0;q<10;q++){var rad=(q%2?3:7)*(0.6+0.4*p),an=q*0.6283;x.lineTo(Math.sin(an)*rad,-Math.cos(an)*rad);}
      x.closePath();x.fill();x.restore();
  }
}

function drawCharmIcon(x,k){
  x.translate(48,48);
  if(k===0){x.fillStyle='#fff1d2';circ(x,0,4,20);circ(x,-16,-14,7);circ(x,-2,-22,7);circ(x,14,-16,7);x.fillStyle='#f27d6b';circ(x,0,5,8);}
  else if(k===1){x.strokeStyle='#bfe9ff';x.lineWidth=5;x.lineCap='round';for(var a=0;a<3;a++){x.beginPath();x.moveTo(-26,-14+a*14);x.quadraticCurveTo(0,-26+a*14,22-a*6,-12+a*14);x.stroke();}}
  else if(k===2){x.fillStyle='#ffc86655';circ(x,0,0,34);x.fillStyle='#ffe9a8';circ(x,0,0,24);x.fillStyle='#f3cf80';circ(x,-8,-6,5);circ(x,8,6,7);circ(x,7,-11,3);}
  else{x.fillStyle='#8fb4ff';x.beginPath();x.arc(0,0,24,0.6,5.2);x.arc(10,-4,19,4.7,1.1,true);x.closePath();x.fill();x.fillStyle='#fff1d2';x.font='700 22px "Baloo 2",sans-serif';x.fillText('z',12,-14);}
}

function drawSprite(i,t,busy){
  var a=anim[i],bob=Math.sin(t*3+i*1.7)*1.1,sq=a.squish;
  ctx.save();
  ctx.translate(0,-Math.sin(Math.min(1,a.jump)*3.1416)*9);
  ctx.scale(1+sq*0.14,1-sq*0.2);
  ctx.fillStyle='#e9d6ad';circ(ctx,-5,-1,3);circ(ctx,5,-1,3);
  ctx.fillStyle='#fff1d2';rr(ctx,-11,-21,22,21,9);
  var arm=busy?Math.sin(t*10+i)*2.2:0;
  circ(ctx,12,-9+arm,3.2);circ(ctx,-12,-9,3.2);
  ctx.fillStyle=ST[i].cap;
  ctx.beginPath();ctx.ellipse(0,-18+bob,18,14,0,3.1416,6.2832);ctx.quadraticCurveTo(0,-12+bob,-18,-18+bob);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff1d2';ctx.globalAlpha=0.88;
  circ(ctx,-8,-25+bob,3);circ(ctx,4,-28.5+bob,2.4);circ(ctx,11,-22.5+bob,2);
  ctx.globalAlpha=1;
  ctx.fillStyle='#2a2140';
  if(Math.sin(t*0.9+i*2.3)>0.985){rr(ctx,-5.6,-10.4,3.2,0.9,0.4);rr(ctx,2.4,-10.4,3.2,0.9,0.4);}
  else{circ(ctx,-4,-10,1.6);circ(ctx,4,-10,1.6);}
  ctx.globalAlpha=0.5;ctx.fillStyle='#f27d6b';circ(ctx,-7.5,-6.5,2);circ(ctx,7.5,-6.5,2);
  ctx.globalAlpha=1;
  ctx.restore();
}

function drawScene(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#131735');g.addColorStop(0.55,'#2a2f63');g.addColorStop(1,'#3b3f7c');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* stars */
  ctx.fillStyle='#fff1d2';
  for(var s=0;s<34;s++){ctx.globalAlpha=0.35+0.4*Math.sin(t*1.3+s*2.1);circ(ctx,rnd(s+1)*W,rnd(s+60)*H*0.4,0.6+rnd(s+120)*0.9);}
  ctx.globalAlpha=1;
  /* moon */
  var mx=W*0.83,my=H*0.15,mr=Math.max(16,Math.min(W,H)*0.085);
  var mg=ctx.createRadialGradient(mx,my,mr*0.6,mx,my,mr*3.4);
  mg.addColorStop(0,'#ffe9a84d');mg.addColorStop(1,'#ffe9a800');
  ctx.fillStyle=mg;circ(ctx,mx,my,mr*3.4);
  ctx.fillStyle='#ffeebc';circ(ctx,mx,my,mr);
  ctx.fillStyle='#f3d992';circ(ctx,mx-mr*0.3,my-mr*0.2,mr*0.2);circ(ctx,mx+mr*0.3,my+mr*0.3,mr*0.26);
  /* tree lines */
  for(var layer=0;layer<2;layer++){
    ctx.fillStyle=layer?'#1c3247':'#1d2550';
    var cnt=layer?9:14,base=H*(layer?0.52:0.46);
    for(var k=0;k<cnt;k++){
      var tx=(k+0.5)/cnt*W+(rnd(k+layer*40)-0.5)*W*0.05,th=H*(0.16+0.12*rnd(k*3+layer*17))*(layer?1.15:1),tw=th*0.42;
      for(var q=0;q<3;q++){var yy=base-th*(0.3*q);ctx.beginPath();ctx.moveTo(tx-tw*(1-q*0.22),yy);ctx.lineTo(tx+tw*(1-q*0.22),yy);ctx.lineTo(tx,yy-th*0.5);ctx.closePath();ctx.fill();}
    }
  }
  /* ground */
  ctx.fillStyle='#234c4b';ctx.beginPath();ctx.ellipse(W/2,H*0.46+H*0.9,W*1.15,H*0.9,0,0,6.2832);ctx.fill();
  ctx.fillStyle='#2c6156';ctx.beginPath();ctx.ellipse(W/2,H*0.56+H*0.85,W*0.98,H*0.85,0,0,6.2832);ctx.fill();
  /* glow buds */
  for(var d=0;d<16;d++){
    var dx=rnd(d+200)*W,dy=H*(0.6+rnd(d+300)*0.38);
    ctx.globalAlpha=0.25+0.25*Math.sin(t*1.6+d);ctx.fillStyle=d%3?'#9fe0b4':'#ffc866';circ(ctx,dx,dy,1.6);
  }
  ctx.globalAlpha=1;

  var u=unit();
  for(var i=0;i<ST.length;i++){
    var p=pos(i),a=anim[i],lv=S.lv[i];
    ctx.save();ctx.translate(p.x,p.y);ctx.scale(u,u);
    ctx.fillStyle='#0f1430';ctx.globalAlpha=0.3;ctx.beginPath();ctx.ellipse(2,1,30,6,0,0,6.2832);ctx.fill();ctx.globalAlpha=1;
    if(lv===0){
      /* sleeping sprout */
      ctx.globalAlpha=0.6;
      ctx.fillStyle='#1b3a3c';ctx.beginPath();ctx.ellipse(0,0,13,5,0,0,6.2832);ctx.fill();
      ctx.strokeStyle='#6fcf8a';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-1);ctx.quadraticCurveTo(1,-8,0,-12);ctx.stroke();
      ctx.fillStyle='#6fcf8a';ctx.beginPath();ctx.ellipse(-4,-13,4.5,2.4,-0.5,0,6.2832);ctx.fill();ctx.beginPath();ctx.ellipse(4,-14,4.5,2.4,0.5,0,6.2832);ctx.fill();
      ctx.globalAlpha=0.45+0.25*Math.sin(t*1.5+i);ctx.fillStyle='#fff1d2';ctx.font='700 11px "Baloo 2",sans-serif';ctx.textAlign='center';
      ctx.fillText('z',9,-20-Math.sin(t*1.5+i)*2);ctx.fillText('z',14,-27-Math.sin(t*1.5+i)*2);
      ctx.globalAlpha=1;
    }else{
      ctx.save();ctx.translate(17,0);drawProp(ctx,i,t,S.prog[i]);ctx.restore();
      ctx.save();ctx.translate(-13,0);drawSprite(i,t,true);ctx.restore();
      /* cycle bar + level */
      ctx.fillStyle='#161a3a';ctx.globalAlpha=0.7;rr(ctx,-24,7,52,5,2.5);ctx.globalAlpha=1;
      ctx.fillStyle='#ffc866';rr(ctx,-24,7,Math.max(5,52*Math.min(1,S.prog[i])),5,2.5);
      ctx.fillStyle='#fff1d2';ctx.font='700 11px "Baloo 2",sans-serif';ctx.textAlign='center';ctx.fillText('Cấp '+lv,2,24);
    }
    ctx.restore();
  }

  /* ambient fireflies */
  var nf=reduce?6:16;
  for(var f=0;f<nf;f++){
    var fx0=(rnd(f+500)*W+Math.sin(t*0.4+f*1.3)*W*0.06+W)%W,fy0=H*(0.3+rnd(f+600)*0.55)+Math.cos(t*0.5+f*2.1)*H*0.04;
    var fa=0.35+0.35*Math.sin(t*2+f*1.9);
    ctx.globalAlpha=fa*0.35;ctx.fillStyle='#ffe58a';circ(ctx,fx0,fy0,5);
    ctx.globalAlpha=fa;circ(ctx,fx0,fy0,1.5);
  }
  ctx.globalAlpha=1;

  /* bonus firefly */
  if(gold){
    var gp=goldPos(t),pulse=1+0.2*Math.sin(t*6);
    ctx.globalAlpha=0.28;ctx.fillStyle='#ffc866';circ(ctx,gp.x,gp.y,20*pulse*u);
    ctx.globalAlpha=0.55;circ(ctx,gp.x,gp.y,10*pulse*u);
    ctx.globalAlpha=1;ctx.fillStyle='#fff6d6';circ(ctx,gp.x,gp.y,4.5*u);
    ctx.fillStyle='#ffffff99';var wf=Math.sin(t*30)*3*u;
    ctx.beginPath();ctx.ellipse(gp.x-5*u,gp.y-5*u+wf*0.3,5*u,2.4*u,-0.6,0,6.2832);ctx.fill();
    ctx.beginPath();ctx.ellipse(gp.x+5*u,gp.y-5*u-wf*0.3,5*u,2.4*u,0.6,0,6.2832);ctx.fill();
  }

  /* floating gains */
  ctx.textAlign='center';
  for(var e=0;e<fx.length;e++){
    var o=fx[e],life=(t-o.t)/1.1;
    ctx.globalAlpha=Math.max(0,1-life*life);
    ctx.font='800 '+Math.round((o.big?17:14)*Math.max(1,u*0.9))+'px "Baloo 2",sans-serif';
    ctx.lineWidth=3;ctx.strokeStyle='#161a3a';ctx.strokeText(o.s,o.x,o.y-life*34);
    ctx.fillStyle=o.big?'#ffc866':'#fff1d2';ctx.fillText(o.s,o.x,o.y-life*34);
  }
  ctx.globalAlpha=1;
}

function goldPos(t){
  var k=(t-gold.t0)/gold.dur,dir=gold.dir;
  var x=dir>0?-30+k*(W+60):W+30-k*(W+60);
  return {x:x,y:H*gold.y+Math.sin(k*9)*H*0.07};
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',function(ev){
  var r=cv.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,u=unit();
  if(!S.hinted){S.hinted=true;elHint.hidden=true;}
  if(gold){
    var gp=goldPos(now);
    if(Math.abs(gp.x-x)<34*u&&Math.abs(gp.y-y)<34*u){
      var prize=Math.max(20,ips()*45);S.coins+=prize;
      fx.push({x:gp.x,y:gp.y,s:'+'+fmt(prize),t:now,big:true});
      toast('Bắt được đom đóm vàng: +'+fmt(prize)+' sương');
      gold=null;nextGold=now+22+Math.random()*22;refresh();return;
    }
  }
  for(var i=0;i<ST.length;i++){
    var p=pos(i);
    if(Math.abs(p.x-x)<Math.min(W/8,46*u)&&y>p.y-62*u&&y<p.y+30*u){
      if(S.lv[i]===0){
        toast((i>0&&S.lv[i-1]===0)?'Bé nấm này còn ngủ. Mở các trạm trước nó đã':'Cần '+fmt(ST[i].cost)+' sương để đánh thức bé nấm này');
      }else{
        S.prog[i]+=tapSec()/cycle(i);anim[i].squish=1;
      }
      return;
    }
  }
});

/* ---------- loop ---------- */
var now=0,lastReal=0,uiT=0,saveT=0;
function earn(i,times,t){
  var amt=income(i)*times;S.coins+=amt;
  var a=anim[i];a.floatAcc+=amt;
  if(t-a.floatT>0.45){
    var p=pos(i);fx.push({x:p.x,y:p.y-52*unit(),s:'+'+fmt(a.floatAcc),t:t});
    a.floatAcc=0;a.floatT=t;if(a.jump<=0)a.jump=1;
  }
}
function step(dt,t){
  for(var i=0;i<ST.length;i++){
    if(S.lv[i]===0) continue;
    S.prog[i]+=dt/cycle(i);
    if(S.prog[i]>=1){var n=Math.floor(S.prog[i]);S.prog[i]-=n;earn(i,n,t);}
    var a=anim[i];
    if(a.jump>0)a.jump=Math.max(0,a.jump-dt*3);
    if(a.squish>0)a.squish=Math.max(0,a.squish-dt*6);
  }
}
function frame(ms){
  var real=ms/1000,dt=lastReal?real-lastReal:0;lastReal=real;
  if(dt>2){
    /* the tab was asleep: pay the gap in one go */
    var gap=Math.min(dt,awayCap()),gain=ips()*gap;
    if(gain>0){S.coins+=gain;toast('Trong lúc bạn rời mắt: +'+fmt(gain)+' sương');}
    dt=0;
  }
  now+=dt;
  step(dt,now);
  if(!gold&&now>nextGold){gold={t0:now,dur:13,dir:Math.random()<0.5?1:-1,y:0.22+Math.random()*0.2};}
  if(gold&&now-gold.t0>gold.dur){gold=null;nextGold=now+25+Math.random()*25;}
  if(fx.length){fx=fx.filter(function(o){return now-o.t<1.1;});}
  drawScene(now);
  if(real-uiT>0.15){uiT=real;refresh();}
  if(real-saveT>5){saveT=real;save();}
  requestAnimationFrame(frame);
}

/* ---------- boot ---------- */
function start(data){
  var restored=!!(data&&data.state&&adopt(data.state));
  var hadSave=restored||load();
  buildRows();syncModes();resize();
  if(S.hinted) elHint.hidden=true;
  if(hadSave&&!restored){
    var away=(Date.now()-S.last)/1000;
    if(away>30){
      var gap=Math.min(away,awayCap()),gain=ips()*gap;
      if(gain>=1){
        S.coins+=gain;
        $('away-amt').textContent='+'+fmt(gain);
        var mins=Math.floor(gap/60);
        $('away-time').textContent='trong '+(mins>=60?Math.floor(mins/60)+' giờ '+(mins%60)+' phút':Math.max(1,mins)+' phút')+(away>gap?' (đã chạm giới hạn vắng mặt)':'')+'.';
        $('modal').hidden=false;
      }
    }
  }
  refresh();save();
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',function(){if(document.hidden)save();});
window.addEventListener('pagehide',save);
var hot=window.claude&&window.claude.hot;
try{if(hot&&hot.snapshot)hot.snapshot(function(){return {state:S};});}catch(e){}
if(hot&&hot.ready){hot.ready(start);}else{start((hot&&hot.data)||{});}
})();
</script>
